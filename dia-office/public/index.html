<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dia's Virtual Office</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Mukta:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="office.css">
<script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.min.js","three/addons/":"/vendor/three/examples/jsm/"}}</script>
</head>
<body>
<div class="wrap">
  <section class="top">
    <div class="brand">
      <span class="diaMini" id="diaMini"></span>
      <div><h1>Inveon Technologies · Virtual Office</h1><p>Run by Dia · <span class="prov" id="prov">connecting…</span></p></div>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="ctrls">
      <span class="key"><input id="key" type="password" placeholder="Director key" autocomplete="off" aria-label="Director key (ADMIN_TOKEN from .env)" title="Paste ADMIN_TOKEN from your .env file, then press Unlock"><button class="btn" id="bKey">Unlock</button></span>
      <button class="btn primary" id="bLead">+ New lead</button>
      <button class="btn primary" id="bCand">+ New candidate</button>
    </div>
  </section>

  <section class="setup" id="setup" hidden aria-live="polite"></section>

  <div class="main" id="main">
    <div class="stagecol">
    <section class="stage" id="stage" hidden aria-label="3D office floor">
      <div class="floor3d" id="floor3d"></div>
      <div class="viewbtns"><button class="btn" id="bView" type="button">Close-up of Dia</button></div>
      <p class="hint">Drag to turn · scroll to zoom · click someone to see their work</p>
    </section>
    <section class="floor" id="floor" aria-label="Office floor"></section>
    </div>
    <aside class="rail">
      <section class="card chat" id="chat" aria-label="Talk to Dia">
        <header><b>Talk to Dia</b><span class="row">
          <button class="btn icon" id="bVoice" type="button" aria-pressed="true" title="Dia speaks her answers">🔊</button>
          <button class="btn icon" id="bChatMin" type="button" aria-expanded="true" title="Hide chat">–</button></span></header>
        <div class="chatbody" id="chatBody">
          <div class="msgs" id="msgs" aria-live="polite"></div>
          <div class="chips" id="chips">
            <button type="button" class="chip">What needs my decision?</button>
            <button type="button" class="chip">How is the office doing?</button>
            <button type="button" class="chip">Check yourself and fix problems</button>
          </div>
          <form class="ask" id="askForm">
            <input id="askIn" autocomplete="off" placeholder="Ask Dia anything…" aria-label="Message to Dia">
            <button class="btn icon" id="bMic" type="button" title="Speak to Dia" hidden>🎤</button>
            <button class="btn primary" id="bSend">Send</button>
          </form>
        </div>
      </section>
      <div class="card" id="leadCard" hidden>
        <h3>New lead</h3>
        <form class="form" id="leadForm">
          <label for="lCompany">Company</label><input id="lCompany" required>
          <div class="two"><div><label for="lContact">Contact</label><input id="lContact"></div><div><label for="lEmail">Email</label><input id="lEmail" type="email"></div></div>
          <label for="lNeed">What they need</label><textarea id="lNeed" required></textarea>
          <div class="two"><div><label for="lBudget">Budget (₹)</label><input id="lBudget" type="number" min="0"></div>
            <div><label for="lSource">Source</label><select id="lSource"><option>Cold call</option><option>CRM</option><option>Website form</option><option>Referral</option><option>International</option></select></div></div>
          <button class="btn primary">Give to Kabir</button><p class="msg" id="leadMsg"></p>
        </form>
      </div>
      <div class="card" id="candCard" hidden>
        <h3>New candidate</h3>
        <form class="form" id="candForm">
          <div class="two"><div><label for="cName">Name</label><input id="cName" required></div><div><label for="cEmail">Email</label><input id="cEmail" type="email"></div></div>
          <div class="two"><div><label for="cRole">Role</label><input id="cRole" required placeholder="Frontend Developer"></div>
            <div><label for="cDept">Department</label><select id="cDept"><option value="eng">Engineering</option><option value="sales">Sales</option><option value="mkt">Marketing</option><option value="hr">HR</option></select></div></div>
          <div class="two"><div><label for="cKind">Type</label><select id="cKind"><option value="human">Human</option><option value="ai">AI agent</option></select></div>
            <div><label for="cCost">Monthly cost (₹)</label><input id="cCost" type="number" min="0" value="20000"></div></div>
          <label for="cResume">Resume or notes</label><textarea id="cResume"></textarea>
          <button class="btn primary">Give to Asha</button><p class="msg" id="candMsg"></p>
        </form>
      </div>
      <div class="card" id="startCard" hidden>
        <h3>Getting started <button class="btn" id="bHideStart" type="button">Hide</button></h3>
        <ul class="steps" id="startSteps"></ul>
      </div>
      <div class="card">
        <h3>Dia needs your decision <span class="count" id="apCount" data-n="0">0</span></h3>
        <div id="approvals"></div>
      </div>
      <div class="card"><h3>Selected</h3><div id="who"></div></div>
      <div class="card"><h3>Projects <span class="pill" id="projCount">0</span></h3><div id="projects"></div></div>
      <div class="card" id="kbCard">
        <h3>Company knowledge <button class="btn" id="bKb" type="button">+ Add document</button></h3>
        <form class="form" id="kbForm" hidden>
          <label for="kTitle">Title</label><input id="kTitle" required placeholder="Leave policy">
          <label for="kContent">Text</label><textarea id="kContent" class="tall" required placeholder="18 paid leaves a year. Working hours 10am–7pm IST."></textarea>
          <button class="btn primary">Teach Dia</button><p class="msg" id="kbMsg"></p>
        </form>
        <div id="kbList"></div>
      </div>
      <div class="card"><h3>Office activity</h3><div class="feed" id="feed" aria-live="polite"></div></div>
    </aside>
  </div>
</div>

<script src="faces.js"></script>
<script type="module" src="office3d.js"></script>
<script>
const DEPTS={dia:{name:"Dia's Cabin",sub:"Owner · final decisions"},hr:{name:"HR",sub:"Hiring · policies · reporting manager"},
  sales:{name:"Sales",sub:"Cold calls · CRM · lead analysis"},eng:{name:"Engineering",sub:"Plan · build · deploy · go live"},mkt:{name:"Marketing",sub:"Campaigns · case studies"}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inr=n=>n?"₹"+Number(n).toLocaleString("en-IN"):"—";
let S={agents:[],approvals:[],projects:[],activity:[],stats:{},stages:[]},selected="dia";
let KEY="";try{KEY=localStorage.getItem("diaKey")||""}catch{}

async function api(path,opts={}){
  const r=await fetch(path,{...opts,headers:{"content-type":"application/json",authorization:"Bearer "+KEY,...(opts.headers||{})}});
  const j=await r.json().catch(()=>({}));
  if(r.status===401)askForKey(j.key);
  if(!r.ok)throw new Error(j.error||("Request failed ("+r.status+")"));
  return j;
}
// Point at the key box when an action needs the director key.
function askForKey(state){
  unlocked=false;const k=document.getElementById("key"),b=document.getElementById("bKey");
  k.classList.add("need");b.textContent=state==="wrong"?"Wrong key":"Unlock";
  window.scrollTo({top:0,behavior:"smooth"});k.focus();
}
const look=a=>({...a.look,skin:SK[a.look?.skin??0]||SK[0],ai:a.kind!=="human"});

/* ---------- Render ---------- */
const floor=document.getElementById("floor");
function renderFloor(){
  const keep={};document.querySelectorAll(".agent .bub").forEach(b=>keep[b.parentElement.dataset.id]=b.textContent);
  floor.innerHTML=Object.entries(DEPTS).map(([k,d])=>k==="dia"?`
    <div class="room cabin" data-d="dia"><header><h2>${d.name}</h2><span>${d.sub}</span></header>
      <div class="cabinRow"><button class="diaBig agent" id="ag-dia" data-id="dia" aria-label="Dia, virtual owner">${diaSVG()}<span class="bub"></span></button>
      <div class="diaSay"><div class="mr">नमस्कार! मी दिया.</div>
        <p>I run the office for Inveon. Every hire and every new project comes to you for the final yes.</p>
        <div class="pipeline"><span>Lead → Analysis → Manager → Dia → You</span><span>Sale order → Work order → Build → Live → Marketing</span><span>Candidate → AI interview → Task → You → Onboard</span></div></div></div></div>`:`
    <div class="room" data-d="${k}"><header><h2>${d.name}</h2><span>${d.sub}</span></header><div class="desks" id="desks-${k}"></div></div>`).join("");
  for(const a of S.agents){
    if(a.id==="dia")continue;
    const el=document.createElement("button");el.className="agent";el.id="ag-"+a.id;el.dataset.id=a.id;
    el.innerHTML=`<span class="bub"></span><span class="body">${face(look(a))}</span><span class="desk"></span>
      <span class="nm">${esc(a.name)}</span><span class="rl">${esc(a.role)}</span><span class="tag ${a.kind==="human"?"human":""}">${a.kind==="human"?"HUMAN":"AI AGENT"}</span>`;
    document.getElementById("desks-"+a.dept)?.appendChild(el);
  }
  window.Office3D?.setAgents(S.agents);
  for(const a of S.agents){const t=keep[a.id]??(a.status!=="Idle"?a.status:"");bubble(a.id,t,!!t&&a.id!=="dia")}
}
floor.addEventListener("click",e=>{const b=e.target.closest(".agent");if(b){selected=b.dataset.id;renderWho()}});
function bubble(id,text,working){
  window.Office3D?.bubble(id,text,working);
  const el=document.getElementById("ag-"+id);if(!el)return;
  el.querySelector(".bub").textContent=text||"";el.classList.toggle("working",!!working&&id!=="dia");
}
function renderWho(){
  const a=S.agents.find(x=>x.id===selected)||S.agents[0];if(!a)return;
  document.querySelectorAll(".agent").forEach(e=>e.classList.toggle("sel",e.dataset.id===selected));
  const av=a.id==="dia"?diaSVG().replace('class="dia"','class="dia av"'):face(look(a));
  const recent=S.activity.filter(x=>x.agent_id===a.id).slice(0,5);
  document.getElementById("who").innerHTML=`<div class="who-panel">${av}<div><b>${esc(a.name)}</b> · ${esc(a.role)}<br>
    <span style="color:var(--muted);font-size:.8rem">${DEPTS[a.dept]?.name||""}${a.monthly_cost?` · ${inr(a.monthly_cost)}/mo`:""} · ${a.tasks_done} tasks done</span></div></div>
    <dl class="kv" style="margin:8px 0 0"><dt>Now</dt><dd>${esc(a.status||"Idle")}</dd></dl>
    ${recent.length?`<ul>${recent.map(r=>`<li>${esc(r.text)}</li>`).join("")}</ul>`:`<p class="empty">No finished work yet.</p>`}`;
}
function renderKpis(){
  const s=S.stats,team=S.agents.filter(a=>a.id!=="dia").length;
  const it=[[team,"Team"],[s.leads,"Leads"],[s.hot,"Hot"],[s.won,"Won"],[s.live,"Live"],["₹"+((s.revenue||0)/1e5).toFixed(1)+"L","Revenue"],
    ["₹"+((s.payroll||0)/1e5).toFixed(2)+"L","Monthly billing"],["$"+(s.ai_spend_usd||0).toFixed(2)+(s.ai_budget_usd?` / ${s.ai_budget_usd}`:""),"AI spend (month)"]];
  document.getElementById("kpis").innerHTML=it.map(([v,l])=>`<div class="kpi"><b>${v??0}</b><span>${l}</span></div>`).join("");
  document.getElementById("prov").textContent="AI: "+(s.provider||"?");
}
function fmtBody(b){
  const rows=Object.entries(b||{}).filter(([k])=>!["client_message"].includes(k)).map(([k,v])=>
    `<dt>${esc(k.replace(/_/g," "))}</dt><dd>${esc(Array.isArray(v)?v.join("; "):typeof v==="number"&&/price|budget|cost/.test(k)?inr(v):v)}</dd>`).join("");
  return `<dl class="kv">${rows}</dl>`;
}
function renderApprovals(){
  const box=document.getElementById("approvals"),n=S.approvals.length,c=document.getElementById("apCount");
  c.textContent=n;c.dataset.n=n;
  if(!n){box.innerHTML='<p class="empty">Nothing waiting. Dia will ask here before any hire or new project.</p>';return}
  const KIND={hire:["Hiring","Hire","Reject"],project:["New project","Approve project","Decline"],code_fix:["Code fix","Approve fix","Discard"]};
  box.innerHTML=S.approvals.map(a=>{const [what,yes,no]=KIND[a.kind]||[a.kind,"Approve","Reject"];
    const detail=a.kind==="code_fix"?`<p>${esc(a.body.explanation)}</p><dl class="kv"><dt>file</dt><dd>${esc(a.body.file)}:${esc(a.body.line)}</dd><dt>error</dt><dd>${esc(a.body.error)}</dd><dt>confidence</dt><dd>${esc(a.body.confidence||"?")}</dd></dl>
      <pre class="rep diff"><span class="del">${esc(a.body.find)}</span>\n<span class="add">${esc(a.body.replace)}</span></pre><p class="note" style="margin:0">Approving opens a pull request for review. The running office is not changed.</p>`
      :`${fmtBody(a.body)}${a.body.client_message?`<p><i>Message to client:</i> ${esc(a.body.client_message)}</p>`:""}`;
    return `<div class="appr"><span class="who">Dia asks · ${what}</span><b>${esc(a.title)}</b>${detail}
    <div class="row"><button class="btn yes" data-ap="${a.id}" data-d="approve">${yes}</button>
    <button class="btn no" data-ap="${a.id}" data-d="reject">${no}</button></div><p class="msg" id="apm${a.id}"></p></div>`}).join("");
}
document.getElementById("approvals").addEventListener("click",async e=>{
  const b=e.target.closest("[data-ap]");if(!b)return;
  try{await api(`/api/approvals/${b.dataset.ap}`,{method:"POST",body:JSON.stringify({decision:b.dataset.d})})}
  catch(err){const m=document.getElementById("apm"+b.dataset.ap);m.textContent=err.message;m.classList.add("err")}
});
const stageCol={Won:"sales","Work order":"sales",Planning:"eng",Building:"eng",Testing:"eng",Deploying:"eng",Live:"ok",Promoted:"mkt"};
function renderProjects(){
  const box=document.getElementById("projects");document.getElementById("projCount").textContent=S.projects.length;
  if(!S.projects.length){box.innerHTML='<p class="empty">Won projects show up here with their sale order and work order.</p>';return}
  box.innerHTML=S.projects.map(p=>{
    const i=S.stages.indexOf(p.stage),next=["Building","Testing","Deploying"].includes(p.stage)?S.stages[i+1]:null,pct=Math.round(i/(S.stages.length-1)*100);
    return `<div class="proj"><div class="top2"><b>${esc(p.company)}</b><span class="pill" style="--c:var(--${stageCol[p.stage]||"eng"})">${esc(p.stage)}</span></div>
      <span style="font-size:.78rem;color:var(--muted)">${esc(p.need)}</span><span class="ids">${esc(p.so||"")} · ${esc(p.wo||"")} · ${inr(p.value)}</span>
      <div class="bar"><i style="width:${pct}%;background:var(--${stageCol[p.stage]||"eng"})"></i></div>
      ${p.plan?`<details><summary style="font-size:.76rem;color:var(--peacock);cursor:pointer">Build plan</summary><pre class="rep">${esc(planText(p.plan))}</pre></details>`:""}
      ${p.marketing?`<details><summary style="font-size:.76rem;color:var(--peacock);cursor:pointer">Marketing drafts</summary><pre class="rep">${esc(JSON.stringify(p.marketing,null,2))}</pre></details>`:""}
      ${next?`<button class="btn" data-pj="${p.id}" data-st="${next}">Mark as ${next}</button>`:""}</div>`}).join("");
}
const planText=p=>`Stack: ${(p.stack||[]).join(", ")}\n${p.architecture||""}\n\nTasks:\n${(p.tasks||[]).map(t=>`- ${t.title} (${t.owner}, ${t.days}d)`).join("\n")}\n\nDeploy: ${p.deploy||""}\nRisks: ${(p.risks||[]).join("; ")}`;
document.getElementById("projects").addEventListener("click",async e=>{
  const b=e.target.closest("[data-pj]");if(!b)return;b.disabled=true;
  try{await api(`/api/projects/${b.dataset.pj}/stage`,{method:"POST",body:JSON.stringify({stage:b.dataset.st})})}catch(err){b.textContent=err.message;b.disabled=false}
});
const feed=document.getElementById("feed");
function evHTML(x){
  const a=S.agents.find(g=>g.id===x.agent_id),t=new Date(x.created_at);
  const d=x.data?(x.data.report||x.data.evaluation||x.data.plan||x.data.campaign||x.data.content||x.data):null;
  return `<time>${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}</time>
    <div style="--c:var(--${a?.dept||"dia"})"><b>${esc(a?.name||"Office")}</b> ${esc(x.text)}
    ${d?`<details><summary>Details</summary><pre class="rep">${esc(typeof d==="string"?d:JSON.stringify(d,null,2))}</pre></details>`:""}</div>`;
}
function renderFeed(){feed.innerHTML=S.activity.map(x=>`<div class="ev">${evHTML(x)}</div>`).join("")||'<p class="empty">Quiet so far. Add a lead or a candidate to start the day.</p>'}

async function fly(from,to,label){
  window.Office3D?.handoff(from,to,label);
  const f=document.getElementById("ag-"+from),t=document.getElementById("ag-"+to);if(!f||!t)return;
  const fr=floor.getBoundingClientRect(),a=f.getBoundingClientRect(),b=t.getBoundingClientRect();
  const d=document.createElement("div");d.className="doc";d.textContent="📄 "+label;
  d.style.left=(a.left-fr.left+a.width/2-30)+"px";d.style.top=(a.top-fr.top+20)+"px";
  floor.appendChild(d);d.getBoundingClientRect();
  d.style.transform=`translate(${b.left-a.left}px,${b.top-a.top}px)`;
  setTimeout(()=>d.remove(),1250);
}

/* ---------- Setup screen ---------- */
const setupEl=document.getElementById("setup"),mainEl=document.getElementById("main");
let H={db:{ok:true},admin_token:"ok",provider:"mock"};
async function health(){try{H=await (await fetch("/api/health")).json()}catch{H={offline:true,db:{ok:false}}}return H}
function showSetup(){
  mainEl.hidden=true;setupEl.hidden=false;
  document.getElementById("prov").textContent=H.offline?"server offline":"setup needed";
  const win=H.platform==="win32";
  const why=H.offline?`<div class="why"><b>The office server is not running.</b><span>Open a terminal in the <code>dia-office</code> folder and run <code>npm start</code>. This page reconnects on its own.</span></div>`
    :`<div class="why"><b>${esc(H.db.hint||"The database is not reachable.")}</b><code>${esc(H.db.error||"")}</code></div>`;
  setupEl.innerHTML=`<div><h2>Let's connect Dia's database</h2>
    <p>The office keeps agents, leads, approvals and company knowledge in Postgres with the pgvector extension. Pick one way to get a database, put its address in <b>DATABASE_URL</b> in your <code>.env</code> file, and press <b>Try again</b>. No restart needed.</p></div>
    ${why}
    <div class="opts">
      <div class="opt rec"><span class="tagline">Recommended · no Docker</span><h3>Free cloud database</h3>
        <ol><li>Sign up at <a href="https://neon.tech" target="_blank" rel="noopener">neon.tech</a> (or <a href="https://supabase.com" target="_blank" rel="noopener">supabase.com</a>) and create a project.</li>
        <li>Copy its connection string.</li>
        <li>In the <code>dia-office</code> folder run:</li></ol>
        <pre>npm run setup -- "postgres://USER:PASS@HOST/neondb?sslmode=require"</pre></div>
      <div class="opt"><span class="tagline">If Docker works</span><h3>Docker</h3>
        <ol><li>Start Docker Desktop.</li><li>In the <code>dia-office</code> folder run:</li></ol>
        <pre>docker compose up -d</pre><p>The default DATABASE_URL already points at it.</p></div>
      <div class="opt"><span class="tagline">${win?"Windows":"Linux / WSL"}</span><h3>Postgres on this computer</h3>
        <ol><li>${win?"In WSL (Ubuntu):":"Install Postgres 16 and pgvector:"}</li></ol>
        <pre>sudo apt install postgresql-16-pgvector</pre>
        <ol start="2"><li>Create user and database <code>dia</code> / password <code>dia</code>.</li></ol></div>
    </div>
    <div class="row"><button class="btn primary" id="bRetry" type="button">Try again</button><span class="msg" id="retryMsg"></span></div>
    <p class="note" style="margin:0">Tip: keep <code>LLM_PROVIDER=mock</code> while you try things out. It runs every flow with free canned answers.</p>`;
  document.getElementById("bRetry").onclick=retry;
}
async function retry(){
  const m=document.getElementById("retryMsg");if(m){m.className="msg";m.textContent="Checking…"}
  try{const r=await fetch("/api/health/retry",{method:"POST"});const j=await r.json();
    if(r.ok){await start();return}
    H.db=j.db;H.offline=false;showSetup();const m2=document.getElementById("retryMsg");m2.textContent="Still not connected. Check the message above.";m2.classList.add("err");
  }catch{H.offline=true;showSetup()}
}

/* ---------- Getting started + knowledge ---------- */
let unlocked=false,KB=null,hideStart=false;try{hideStart=localStorage.getItem("diaHideStart")==="1"}catch{}
function renderStart(){
  const s=S.stats||{},card=document.getElementById("startCard");
  const items=[
    [true,"Database connected",""],
    [H.admin_token==="ok"?unlocked:false,"Unlock with the director key",H.admin_token==="ok"?"Paste ADMIN_TOKEN from your .env into the key box above.":"ADMIN_TOKEN is not set. Run <code>npm run setup</code> and restart.",H.admin_token!=="ok"],
    [(KB?.length||0)>0,"Teach Dia about the company","Add a policy or price list under Company knowledge."],
    [(s.leads||0)>0,"Give Kabir a lead","Press + New lead. Mock mode answers instantly and for free."],
    [S.agents.some(a=>a.id.startsWith("c")),"Hire someone","Press + New candidate and choose AI agent for an automatic interview."]];
  const done=items.every(i=>i[0]);
  card.hidden=hideStart||done;
  document.getElementById("startSteps").innerHTML=items.map(([ok,t,sub,warn])=>`<li class="${ok?"done":warn?"warn":""}"><div>${t}${!ok&&sub?`<span>${sub}</span>`:""}</div></li>`).join("");
}
document.getElementById("bHideStart").onclick=()=>{hideStart=true;try{localStorage.setItem("diaHideStart","1")}catch{};renderStart()};
async function loadKb(){
  const box=document.getElementById("kbList");
  if(!unlocked){KB=null;box.innerHTML='<p class="empty">Unlock with the director key to see and add documents. Agents read these before they answer.</p>';renderStart();return}
  try{KB=await api("/api/kb")}catch(e){box.innerHTML=`<p class="empty">${esc(e.message)}</p>`;return}
  box.innerHTML=KB.length?`<ul class="docs">${KB.map(d=>`<li><span>${esc(d.title)}</span><small>${d.chunks} part${d.chunks>1?"s":""}</small></li>`).join("")}</ul>`
    :'<p class="empty">No documents yet. Add policies, price lists, past proposals or hiring criteria.</p>';
  renderStart();
}
document.getElementById("bKb").onclick=()=>{const f=document.getElementById("kbForm");f.hidden=!f.hidden;if(!f.hidden)document.getElementById("kTitle").focus()};
document.getElementById("kbForm").onsubmit=async e=>{
  e.preventDefault();const m=document.getElementById("kbMsg");m.className="msg";m.textContent="Saving…";
  try{const r=await api("/api/kb",{method:"POST",body:JSON.stringify({title:v("kTitle"),content:document.getElementById("kContent").value})});
    e.target.reset();m.textContent=`Saved in ${r.chunks} part${r.chunks>1?"s":""}. Agents will use it from now on.`;loadKb()}
  catch(err){m.textContent=err.message;m.classList.add("err")}
};
async function checkKey(){
  if(!KEY){unlocked=false;return}
  try{await api("/api/auth/check");unlocked=true;document.getElementById("key").classList.remove("need")}catch{unlocked=false}
  document.getElementById("bKey").textContent=unlocked?"Unlocked":"Unlock";
}

/* ---------- Data ---------- */
async function load(){
  const r=await fetch("/api/state");
  if(r.status===503){await health();showSetup();throw new Error("setup")}
  S=await r.json();setupEl.hidden=true;mainEl.hidden=false;
  renderFloor();renderKpis();renderApprovals();renderProjects();renderFeed();renderWho();renderStart();
}
let refreshT;const refreshSoon=()=>{clearTimeout(refreshT);refreshT=setTimeout(load,400)};
function connect(){
  const ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws");
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.type==="agent"){const a=S.agents.find(x=>x.id===m.id);if(a)a.status=m.status||"Idle";bubble(m.id,m.status,m.working);if(m.id===selected)renderWho()}
    if(m.type==="activity"){S.activity.unshift(m.item);S.activity=S.activity.slice(0,60);
      const a=S.agents.find(x=>x.id===m.item.agent_id);if(a)a.tasks_done++;
      const el=document.createElement("div");el.className="ev";el.innerHTML=evHTML(m.item);feed.querySelector(".empty")?.remove();feed.prepend(el);
      if(m.item.agent_id===selected)renderWho()}
    if(m.type==="handoff")fly(m.from,m.to,m.label);
    if(m.type==="approval"){S.approvals.push(m.item);renderApprovals()}
    if(m.type==="approval_done"){S.approvals=S.approvals.filter(a=>a.id!==m.id);renderApprovals()}
    if(m.type==="refresh")refreshSoon();
  };
  ws.onclose=()=>{document.getElementById("prov").textContent="reconnecting…";setTimeout(()=>{connect();load().catch(()=>{})},2000)};
}

/* ---------- Director controls ---------- */
const keyIn=document.getElementById("key");keyIn.value=KEY;
document.getElementById("bKey").onclick=async()=>{
  KEY=keyIn.value.trim();try{localStorage.setItem("diaKey",KEY)}catch{}
  try{await api("/api/auth/check");const was=unlocked;unlocked=true;keyIn.classList.remove("need");document.getElementById("bKey").textContent="Unlocked";if(!was)greet()}
  catch(e){unlocked=false;document.getElementById("bKey").textContent=/ADMIN_TOKEN is not set/.test(e.message)?"Key not set":"Wrong key"}
  loadKb();
};
document.getElementById("bLead").onclick=()=>{const c=document.getElementById("leadCard");c.hidden=!c.hidden;if(!c.hidden)document.getElementById("lCompany").focus()};
document.getElementById("bCand").onclick=()=>{const c=document.getElementById("candCard");c.hidden=!c.hidden;if(!c.hidden)document.getElementById("cName").focus()};
const v=id=>document.getElementById(id).value.trim();
document.getElementById("leadForm").onsubmit=async e=>{
  e.preventDefault();const m=document.getElementById("leadMsg");m.className="msg";
  try{await api("/api/leads",{method:"POST",body:JSON.stringify({company:v("lCompany"),contact:v("lContact"),email:v("lEmail"),need:v("lNeed"),budget:+v("lBudget")||null,source:v("lSource")})});
    e.target.reset();m.textContent="Kabir has the lead.";}catch(err){m.textContent=err.message;m.classList.add("err")}
};
document.getElementById("candForm").onsubmit=async e=>{
  e.preventDefault();const m=document.getElementById("candMsg");m.className="msg";
  const kind=v("cKind");
  try{const r=await api("/api/candidates",{method:"POST",body:JSON.stringify({name:v("cName"),email:v("cEmail"),role:v("cRole"),dept:v("cDept"),kind,monthly_cost:+v("cCost")||0,resume:v("cResume")})});
    e.target.reset();m.textContent=kind==="ai"?"Asha is interviewing the AI agent.":"Interview link: "+r.interview_link;}catch(err){m.textContent=err.message;m.classList.add("err")}
};

/* ---------- 3D office ---------- */
function init3d(){
  const O=window.Office3D;if(!O)return;
  document.getElementById("stage").hidden=false;floor.hidden=true;
  O.onSelect=id=>{selected=id;renderWho();if(id==="dia"){document.getElementById("askIn").focus();O.wave()}};
  if(S.agents.length){O.setAgents(S.agents);for(const a of S.agents)if(a.status&&a.status!=="Idle")O.bubble(a.id,a.status,a.id!=="dia")}
}
window.addEventListener("office3d-ready",init3d);
let closeUp=false;
document.getElementById("bView").onclick=e=>{closeUp=!closeUp;closeUp?window.Office3D?.focusDia():window.Office3D?.resetView();e.target.textContent=closeUp?"Whole office":"Close-up of Dia"};

/* ---------- Talk to Dia ---------- */
const msgs=document.getElementById("msgs"),askIn=document.getElementById("askIn"),history=[];
let voiceOn=true;try{voiceOn=localStorage.getItem("diaVoice")!=="0"}catch{}
const bVoice=document.getElementById("bVoice");
const syncVoice=()=>{bVoice.setAttribute("aria-pressed",voiceOn);bVoice.textContent=voiceOn?"🔊":"🔇";bVoice.title=voiceOn?"Dia speaks her answers (click to mute)":"Dia is muted (click to unmute)"};syncVoice();
bVoice.onclick=()=>{voiceOn=!voiceOn;try{localStorage.setItem("diaVoice",voiceOn?"1":"0")}catch{};if(!voiceOn)speechSynthesis?.cancel();syncVoice()};
document.getElementById("bChatMin").onclick=e=>{const b=document.getElementById("chatBody"),open=b.hidden;b.hidden=!open;e.target.textContent=open?"–":"+";e.target.setAttribute("aria-expanded",open)};
function pickVoice(){
  const vs=window.speechSynthesis?.getVoices()||[];
  return vs.find(v=>/en-IN/i.test(v.lang)&&/female|heera|veena|neerja|swara|kajal/i.test(v.name))||vs.find(v=>/en-IN/i.test(v.lang))
    ||vs.find(v=>/^en/i.test(v.lang)&&/female|samantha|zira|aria|jenny|google uk english female/i.test(v.name))||vs.find(v=>/^en/i.test(v.lang));
}
let talkT;
function speak(text){
  const O=window.Office3D;clearTimeout(talkT);
  bubble("dia",text.length>90?text.slice(0,88)+"…":text,false);
  const done=()=>{O?.talk(false);talkT=setTimeout(()=>bubble("dia","",false),4000)};
  if(voiceOn&&window.speechSynthesis){
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text.replace(/₹/g,"rupees ").replace(/[*_#`]/g,""));
    const v=pickVoice();if(v){u.voice=v;u.lang=v.lang}else u.lang="en-IN";
    u.rate=1.02;u.pitch=1.12;u.onstart=()=>O?.talk(true);u.onend=done;u.onerror=done;
    speechSynthesis.speak(u);
  }else{O?.talk(true);talkT=setTimeout(done,Math.min(9000,300*text.split(/\s+/).length))}
}
function addMsg(role,text,action){
  const el=document.createElement("div");el.className="m "+role;
  el.innerHTML=`<p>${esc(text)}</p>`;
  if(action){const b=document.createElement("button");b.type="button";b.className="btn act";b.textContent=action.label;
    b.onclick=async()=>{b.disabled=true;try{const r=await api(action.path,{method:action.method,body:JSON.stringify(action.body)});
      b.textContent="Done ✓";
      if(r&&r.findings){const t=selfCheckText(r);addMsg("dia",t,r.can_repair?{label:"Draft a code fix for my latest error",method:"POST",path:"/api/dia/repair",body:{}}:null);speak(t)}
      if(r&&r.kind==="code_fix"){const t="I've drafted a fix. It's in your decisions box with the exact change. Nothing changes until you approve it.";addMsg("dia",t);speak(t)}}
      catch(err){b.textContent=err.message;b.disabled=false}};
    el.appendChild(b)}
  msgs.appendChild(el);msgs.scrollTop=msgs.scrollHeight;
}
function selfCheckText(r){
  const parts=r.findings.filter(f=>f.level!=="info").map(f=>f.text);
  if(r.repaired.length)parts.unshift(`I restarted ${r.repaired.length} stuck item${r.repaired.length>1?"s":""}: ${r.repaired.join(", ")}.`);
  return parts.length?parts.join(" "):"All good! The database, the AI and every flow are healthy. Nothing is stuck.";
}
async function sendChat(text){
  text=text.trim();if(!text)return;
  addMsg("me",text);askIn.value="";
  if(!unlocked){const t="Please unlock with your director key first. It's the box at the top right. Then I can tell you everything about the office.";addMsg("dia",t);speak(t);askForKey();return}
  const typing=document.createElement("div");typing.className="m dia typing";typing.innerHTML="<p><i></i><i></i><i></i></p>";msgs.appendChild(typing);msgs.scrollTop=msgs.scrollHeight;
  try{const r=await api("/api/dia/chat",{method:"POST",body:JSON.stringify({message:text,history})});
    typing.remove();history.push({role:"me",text},{role:"dia",text:r.reply});addMsg("dia",r.reply,r.action);speak(r.reply)}
  catch(err){typing.remove();addMsg("dia",err.message)}
}
document.getElementById("askForm").onsubmit=e=>{e.preventDefault();sendChat(askIn.value)};
document.getElementById("chips").onclick=e=>{const c=e.target.closest(".chip");if(c)sendChat(c.textContent)};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){const bMic=document.getElementById("bMic");bMic.hidden=false;
  bMic.onclick=()=>{const r=new SR();r.lang="en-IN";r.interimResults=false;bMic.classList.add("rec");
    r.onresult=e=>sendChat(e.results[0][0].transcript);r.onend=()=>bMic.classList.remove("rec");r.onerror=()=>bMic.classList.remove("rec");r.start()}}
addMsg("dia","Namaskar! I'm Dia. Ask me what needs your decision, how the office is doing, or tell me to check and fix myself.");
function greet(){const t="Namaskar! I'm Dia, and the office is ready. Ask me anything.";window.Office3D?.wave();speak(t)}

document.getElementById("diaMini").innerHTML=diaSVG();
let wsOn=false;
async function start(){
  try{await health();if(!H.db.ok){showSetup();return}
    await load();init3d();await checkKey();loadKb();if(!wsOn){wsOn=true;connect()}}
  catch(e){if(e.message!=="setup"){H={offline:true,db:{ok:false}};showSetup();setTimeout(start,4000)}}
}
start();
</script>
