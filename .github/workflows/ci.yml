name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  office:
    name: Office (Node)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dia
          POSTGRES_PASSWORD: dia
          POSTGRES_DB: dia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dia" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: dia-office
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dia-office/package-lock.json
      - run: npm ci
      - run: for f in src/*.js src/workflows/*.js scripts/*.js public/office3d.js; do node --check "$f"; done
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://dia:dia@localhost:5432/dia_test

  agents:
    name: Agents (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dia-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dia-ai/requirements.txt
      - run: pip install -r requirements.txt
      - run: python selftest.py

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dia-office
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dia-office .
      - name: Image starts and shows the setup screen without a database
        run: |
          docker run -d --name office -p 8080:8080 -e DATABASE_URL=postgres://none:none@127.0.0.1:1/none dia-office
          for i in $(seq 1 20); do curl -fs localhost:8080/api/health && break; sleep 1; done
          curl -fs localhost:8080/api/health | grep -q '"ok":false'
          curl -fs localhost:8080/ | grep -q "Virtual Office"
